version: "3.8"

# ==============================================================================
# AgentApply AI - Default Docker Compose Configuration
# ==============================================================================
# NOTE: This default stack runs the base production setup.
#
# To run specifically with the CrewAI Multi-Agent framework:
#   docker compose -f docker-compose.crewai.yml up --build -d
#
# To run specifically with the LangGraph State-Machine framework:
#   docker compose -f docker-compose.langgraph.yml up --build -d
#
# To enable n8n workflow automation alongside either stack, add:
#   --profile with-n8n
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: crewai
    container_name: agentapply-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HEADLESS=true
      - RESUME_PATH=/app/resume.pdf
      - JOB_DB_PATH=/app/jobs_database.json
      - EXCEL_TRACKER_PATH=/app/job_applications.xlsx
    ports:
      - "8002:8002"
    volumes:
      - ./jobs_database.json:/app/jobs_database.json
      - ./applied_jobs.json:/app/applied_jobs.json
      - ./job_applications.xlsx:/app/job_applications.xlsx
      - ./logs:/app/logs
      - ./resume.pdf:/app/resume.pdf:ro
    shm_size: "2gb"
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/stats"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - agentapply-network

networks:
  agentapply-network:
    driver: bridge
    name: agentapply-network
